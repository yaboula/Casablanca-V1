services:
  - type: web
    name: nexus-backend
    env: node
    rootDir: backend
    region: frankfurt # Cercano a África/Marruecos/España
    plan: free # Plan de Render gratuito
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: API_PREFIX
        value: "api/v1"
      # CORS: URL de producción de Vercel (Next.js config variable)
      - key: FRONTEND_URL
        sync: false

      # === Bases de Datos / Caché (Variables Sincronizadas después manualmente) ===
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # === STRIPE Config (Variables requeridas por tu backend) ===
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # === Seguridad JWT ===
      - key: JWT_SECRET
        generateValue: true # Genera un hash aleatorio la primera vez automáticamente
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: "30d"

      # === Mock AWS S3 (Para evitar error de arranque inicial) ===
      - key: AWS_ACCESS_KEY_ID
        value: "mock_access_key"
      - key: AWS_SECRET_ACCESS_KEY
        value: "mock_secret_key"
      - key: AWS_S3_BUCKET
        value: "nexus-bucket"
      - key: AWS_REGION
        value: "eu-west-3"

      # === Firma de QR ===
      - key: QR_SIGNING_SECRET
        generateValue: true

      # === Business / Operator ===
      - key: OPERATOR_WHATSAPP
        value: "+212600000000"
